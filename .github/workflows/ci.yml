name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12.*']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none

      - name: Require the Laravel version under test
        run: composer require "illuminate/support:${{ matrix.laravel }}" --no-interaction --no-update

      # Until the matching fopost/sdk release is on Packagist, resolve it from its repository.
      - name: Resolve fopost/sdk from its repository
        run: |
          composer config repositories.fopost-sdk vcs https://github.com/fopost/fopost-php
          composer require "fopost/sdk:^0.4 || dev-main" --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run the test suite
        run: ./vendor/bin/phpunit
